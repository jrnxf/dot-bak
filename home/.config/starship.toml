add_newline = false
format = "$hostname$directory$git_branch${custom.dotfiles}$cmd_duration$line_break$character"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold black bg:yellow"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

[cmd_duration]
format = "[$duration]($style) "

# Shows only when ~/dotfiles needs attention; see dotsync.sh for the markers.
[custom.dotfiles]
command = "dotsync status"
when = "command -v dotsync"
shell = ["sh"]
format = "[$output]($style) "
style = "yellow"
