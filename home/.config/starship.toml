add_newline = false
format = "$hostname$directory$git_branch$cmd_duration$line_break$character"

[hostname]
ssh_only = true
format = "[ ssh $hostname ]($style) "
style = "bold black bg:yellow"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

[cmd_duration]
format = "[$duration]($style) "
