add_newline = false
format = "$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold black bg:yellow"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

[cmd_duration]
format = "[$duration]($style) "
