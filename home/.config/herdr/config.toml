onboarding = false
[keys]
prefix = "ctrl+b"
focus_pane_left  = ["prefix+h", "prefix+left"]
focus_pane_down  = ["prefix+j", "prefix+down"]
focus_pane_up    = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

# Create tabs immediately with generated names instead of prompting for one.
# Rename later with rename_tab (default prefix+shift+t).
prompt_new_tab_name = false

# Name the machine the panes run on at the right edge of the tab bar. herdr
# resolves it on the server, so a remote attach shows the remote machine.
tab_bar_right = [{ type = "hostname" }]

# Chosen in herdr's own settings. herdr writes it back here on every change,
# so it is tracked instead of left as a permanent uncommitted line.
status_indicators = "dots"

[ui.sidebar.spaces]
# One row per space: just its state icon and name. The default adds a second
# row with the git branch and status.
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
# One row per agent: its state icon, space and tab. The default also names the
# machine, which repeats the space where the two share a name, and adds a
# second row with the agent program, which is always the same one here.
rows = [["state_icon", "workspace", "tab"]]

[ui.toast]
delivery = "herdr"

[remote]
# Plain ssh for saved machines instead of herdr's own shared connection. After
# the Mac sleeps that connection is stalled, herdr retries through it, and the
# machine sits on "connecting" for a minute or more (herdrdev/herdr#4721).
# Drop this once that is fixed: the shared connection is what makes
# `herdr --machine` commands start fast.
manage_ssh_config = false

[theme]
name = "catppuccin"
auto_switch = false
